name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ricoz/database exec prisma validate --schema=prisma/schema.prisma
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm build
      - run: pnpm -r test
