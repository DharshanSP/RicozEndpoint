services:
  # ── Backend API (Node + Fastify + Prisma/Postgres) ──────────────────────────
  - type: web
    name: ricoz-api
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @ricoz/shared-types build && pnpm --filter @ricoz/validation build && pnpm --filter @ricoz/database generate && pnpm --filter @ricoz/api build
    startCommand: pnpm --filter @ricoz/database migrate:deploy && pnpm --filter @ricoz/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: APP_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_ENROLLMENT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 12h
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"

  # ── Frontend (Next.js) ───────────────────────────────────────────
  # Set NEXT_PUBLIC_API_URL to the live API above (e.g. https://ricoz-api.onrender.com/api)
  # and CORS_ORIGIN on the API to this service's URL.
  - type: web
    name: ricoz-web
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @ricoz/web build
    # next start honors Render's PORT when -p is not passed.
    startCommand: pnpm --filter @ricoz/web exec next start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      # Public runtime config, inlined at build time: point this at the API above
      # (e.g. https://ricoz-api.onrender.com/api) before the first deploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_AGENT_DOWNLOAD_URL
        sync: false
